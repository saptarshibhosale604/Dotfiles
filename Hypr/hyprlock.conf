general {
    no_fade_in = true
    grace = 1
    hide_cursor = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

background {
    color = rgba(0, 0, 0, 1.0)
}

input-field {
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_rounding = -1
    outer_color = rgb(21, 21, 21)
    inner_color = rgb(255, 255, 255)
    font_color = rgb(200, 200, 200)
    fail_color = rgb(255, 0, 0)
    position = 0, 0
    halign = center
    valign = center
}

label {
    text = "Locked - $USER"
    font_size = 20
    position = 0, 60
    halign = center
    valign = center
}

